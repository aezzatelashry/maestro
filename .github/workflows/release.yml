name: release

# Two ways to cut a release, both from the version in .claude-plugin/plugin.json:
#   - push a tag vX.Y.Z (it must equal that version), or
#   - press "Run workflow" on main: the release creates the tag itself.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install ruff pytest
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Tests
        run: python -m pytest -q

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version, and the tag it must equal
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ -z "$version" ]; then
            echo "no version in .claude-plugin/plugin.json" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "tag $GITHUB_REF_NAME does not match plugin version $version" >&2
              exit 1
            fi
          elif [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "a manual release runs from main only, not $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the standalone skill
        run: python3 scripts/package_skill.py elashry-pro-maestro-skill.zip
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; bump the version in plugin.json first" >&2
            exit 1
          fi
          notes="**Plugin (recommended, includes the hooks and the four bundled agents):** \`/plugin marketplace add aezzatelashry/maestro\`, then \`/plugin install elashry-maestro@maestro\`.

          **Standalone skill (no hooks, no bundled agents):** download \`elashry-pro-maestro-skill.zip\`, unzip it into \`~/.claude/skills/\`, then run \`/elashry-pro-maestro-skill\`. LICENSE and NOTICE are inside the zip.

          See CHANGELOG.md."
          gh release create "$TAG" elashry-pro-maestro-skill.zip \
            --target "$GITHUB_SHA" \
            --title "Maestro $VERSION" \
            --notes "$notes" \
            --generate-notes
